[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "mazegen"
version = "1.0.0"
description = "A reusable Python maze generator"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Omar Alabed" }
]
license = { file = "LICENSE.md" }

[tool.setuptools.packages.find]
include = ["mazegen*"]