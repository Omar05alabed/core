[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "mazegen"
version = "1.0.0"
description = "A reusable single-file Python maze generator"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Omar Alabed" }
]
license = "MIT"
license-files = ["LICENSE.md"]

[tool.setuptools]
py-modules = ["mazegen"]
